<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Cheat Sheet</title>
</head>

<body>
    <h1>HTML Cheat Sheet</h1>

    <p>Common HTML tags for beginners.</p>

    <ul>
        <li><code>&lt;h1&gt;</code> - main heading</li>
        <li><code>&lt;p&gt;</code> - paragraph</li>
        <li><code>&lt;a&gt;</code> - link</li>
        <li><code>&lt;img&gt;</code> - image</li>
        <li><code>&lt;ul&gt;</code> and <code>&lt;li&gt;</code> - list and list item</li>
        <li><code>&lt;form&gt;</code> - form</li>
        <li><code>&lt;table&gt;</code> - table</li>
        <li><code>&lt;header&gt;</code>, <code>&lt;main&gt;</code>, <code>&lt;footer&gt;</code> - page sections</li>
    </ul>
</body>

</html>
